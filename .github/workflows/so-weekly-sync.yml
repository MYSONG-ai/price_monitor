name: so-weekly-sync

on:
  schedule:
    # Monday 06:00 UTC = Monday 14:00 CST; previous ISO week is complete.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      week:
        description: "ISO week number (empty = last complete ISO week)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run weekly SO sync
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
        run: |
          ARGS="--backend openapi"
          if [ -n "${{ github.event.inputs.week }}" ]; then
            ARGS="$ARGS --week ${{ github.event.inputs.week }}"
          fi
          python so_weekly_sync/sync_weekly.py $ARGS
